services:
  ventas-app:
    build: .
    container_name: ventas-app
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}@mysql_central:3306/ventas_control"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}@redis_central:6379"
      JWT_SECRET: "${JWT_SECRET:?Define JWT_SECRET en .env}"
      CRON_SECRET: "${CRON_SECRET:-}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_TEMPLATE_NAME: "${WHATSAPP_TEMPLATE_NAME:-}"
      WHATSAPP_TEMPLATE_LANGUAGE: "${WHATSAPP_TEMPLATE_LANGUAGE:-es_PE}"
      WHATSAPP_DEFAULT_COUNTRY_CODE: "${WHATSAPP_DEFAULT_COUNTRY_CODE:-51}"
      WHATSAPP_GRAPH_VERSION: "${WHATSAPP_GRAPH_VERSION:-v22.0}"
    networks:
      - shared-infra
    labels:
      - "traefik.enable=true"
      # Subdominio para la aplicación / API
      - "traefik.http.routers.ventas.rule=Host(`ventas.forwardvision.cloud`)"
      - "traefik.http.routers.ventas.entrypoints=websecure"
      - "traefik.http.routers.ventas.tls.certresolver=myresolver" # Matches central traefik config
      - "traefik.http.services.ventas.loadbalancer.server.port=3000"

networks:
  shared-infra:
    external: true
